<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            width:500px;
            outline: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }
        .container>div{
            outline: 1px dashed grey;
        }
        #box1{
            grid-column: 1/4;
            grid-row: 1/4;
        }
        #box2{
            grid-column: 4/5;
            grid-row: 1/3;
        }
        #box3{
            grid-column: 4/5;
            grid-row: 3/5;
        }
        #box4{
            grid-column: 1/4;
            grid-row: 4/6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
