<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body {
            display: flex;
            height: 100vh;
            width: 100%;
            align-items: center;
            justify-content: center;
        }
        .container {
            border: 2px solid black;
            width: 90vw;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-areas: 
                "box1 box1 box1"
                "box2 box3 box3"
                "box2 box3 box3"
                "box2 box4 box5"
                "box6 box6 box6";
            grid-auto-rows: minmax(80px, auto);
            gap: 15px;
            padding: 20px;
        }
        #statbox {
            grid-area: box3;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-areas: 
                "box7 box8 box9"
                "box10 box11 box12";
            grid-auto-rows: minmax(60px, auto);
            gap: 15px;
        }
        .box {
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-item {
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;">HEADER</div>
        <div class="box" style="grid-area: box2;">SIDEBAR</div>
        
        <div id="statbox">
            <div class="stat-item" style="grid-area: box7">STAT</div>
            <div class="stat-item" style="grid-area: box8">STAT</div>
            <div class="stat-item" style="grid-area: box9">STAT</div>
            <div class="stat-item" style="grid-area: box10">STAT</div>
            <div class="stat-item" style="grid-area: box11">STAT</div>
            <div class="stat-item" style="grid-area: box12">STAT</div>
        </div>

        <div class="box" style="grid-area: box4;">RECENT ORDERS</div>
        <div class="box" style="grid-area: box5;">ACTIVITY</div>
        <div class="box" style="grid-area: box6;">FOOTER</div>
    </div>
</body>
</html>
