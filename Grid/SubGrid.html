<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --primary-color:blue;
        --secondary-color: pink;
        background-color: aquamarine;
        --text-size: 30px;
    }

    .container{
        display: grid;
        grid-template-columns: repeat(16,1fr);
        grid-template-rows: repeat(16,1fr);
        height: 500px;
        width: 500px;
        outline: 1px solid black;
        background-color:bisque;
    }
    .parent{
        display: grid;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        font-size: 30px;
        background-color: blue;
        grid-column: 1/16;
        grid-row: 1/16;
    }
    .child{
        display: grid;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        font-size: 30px;
        background-color: red;
        grid-column: 1/8;
        grid-row: 1/8;
    }
    .subchild{
        display: grid;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        font-size: 30px;
        background-color: yellow;
        grid-column: 1/4;
        grid-row: 1/4;
    }
    .subsubchild{
        display: grid;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        font-size: 30px;
        background-color: aqua;
        grid-column: 1/2;
        grid-row: 1/2;
    }
    .subsubsubchild{
        grid-column: 1/2;
        grid-row: 1/2;
        background-color: var(--secondary-color);
        font-size: var(--text-size);
    }
</style>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                <div class="subchild">
                    <div class="subsubchild">
                        <div class="subsubsubchild">
                            Hello
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
