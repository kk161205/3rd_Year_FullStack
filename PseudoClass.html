<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: bisque;
            color:aqua;
        }
        button:focus{
            background-color: chocolate;
            color:darkgoldenrod;
        }
        button:active{
            background-color: black;
            color:white;
        }
        a:link{
            color:green;
        }
        a:visited{
            color:purple;
        }
        
    </style>
</head>
<body>
    <button>Click Me!</button>
    <br>
    <a href="https://claude.ai/new">Visit</a>
</body>
</html>
