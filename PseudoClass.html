<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: bisque;
            color:aqua;
        }
        button:focus{
            background-color: chocolate;
            color:darkgoldenrod;
        }
        button:active{
            background-color: black;
            color:white;
        }
        a:link{
            color:green;
        }
        a:visited{
            color:purple;
        }
        input:checked{
            accent-color: pink;
            box-shadow: 1px 1px 5px black;
            height: 20px;
            width: 20px;
        }
        li:nth-child(oddw){
            color:black;
            background-color: white;
        }
        li:nth-child(even){
            background-color: black;
            color: white;
        }
        li:not(:hover){
            color:red;
        }
    </style>
</head>
<body>
    <button>Click Me!</button>
    <br>
    <a href="https://claude.ai/new">Visit</a>
    <input type="checkbox" checked/>
    <input type="checkbox"/>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
        <li>10</li>
        <li>11</li>
        <li>12</li>
        <li>13</li>
        <li>14</li>
        <li>15</li>
    </ul>
</body>
</html>
