<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            display:flex;
            height: 100vh;
            width:100%;
            align-items: center;
            justify-content: center;
        }
        .container {
            border: 2px solid black;
            width: 90vw; 
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-areas: 
                "box1 box1 box1" 
                "box2 box3 box3" 
                "box2 box3 box3" 
                "box2 box4 box5" 
                "box6 box6 box6";
            grid-auto-rows: minmax(80px, auto);
            gap: 15px;
            padding: 20px; 
            box-sizing: border-box;
        }
        .box {
            border:2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;">HEADER</div>
        <div class="box" style="grid-area: box2;">SIDEBAR</div>
        <div class="box" style="grid-area: box3;">MAIN CONTENT</div>
        <div class="box" style="grid-area: box4;">CARD1</div>
        <div class="box" style="grid-area: box5;">CARD2</div>
        <div class="box" style="grid-area: box6;">FOOTER</div>
    </div>
</body>
</html>
