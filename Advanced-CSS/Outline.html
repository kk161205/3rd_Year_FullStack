<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        .box{
            border: 1px solid;
            border-radius: 3px;
            display: inline-block;
            margin: 10px;
            padding: 5px;
        }

        .box:hover {
            outline: 4px dotted #ee7733;
            outline-offset: 4px;
            background: #ffffaa;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>This is a Box</p>
    </div>
</body>
</html>
