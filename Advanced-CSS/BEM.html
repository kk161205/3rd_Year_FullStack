<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            outline: 1px solid black;
            width: 700px;
            padding: 3%;
            box-shadow: 3px 3px 5px grey;
            margin:auto;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }
        .card_text{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 900;
        }
        .card_button_submit{
            background-color: black;
            color:white;
            box-shadow: 3px 3px 5px grey;
            width:100px;
            height:40px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="anime3.jpeg" class="card_img"/>
        <p class="card_text">Black Clover</p>
        <button class="card_button_submit">Submit</button>
    </div>
</body>
</html>
