<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 95vh;
            width:95vw;
            display:flex;
            justify-content: center;
            align-items: center;
            background-color: grey;
        }
        .container{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            background-color: beige;
            height:350px;
            width:300px;
            border-radius: 10px;
            border: 2px solid black;
        }
        .inputs{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 20%;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size: 25px;" >Login</h3>
        <div class="inputs">
            <label>Username</label>
            <input type="text" style="width: 100%;" placeholder="Enter your username">
            <label>Password</label>
            <input type="password" style="width: 100%;" placeholder="Enter your password">
        </div>
        <button style="height: 40px; width: 100px; border-radius: 20px;color: white;background-color: green;" >Login</button>
    </div>
</body>
</html>
