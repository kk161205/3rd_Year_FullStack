<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin:auto;
            height: 97vh;
            width:97vw;
            border: 2px solid black;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            border-radius: 1%;
        }
        .navbar{
            
            height:90%;
            width:25vw;
            border:1px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap:20px;
        }
        .content{
            height:90%;
            width:65vw;
            border:1px solid black;
        }
        .title{
            font-size: 50px;
        }
        ul{
            list-style-type: none;
            margin: 0; 
            gap: 15px;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        li{
            display: block;
            font-size: 20px;
        }
        .header{
            display: flex;
            justify-content: space-evenly;
            flex-direction: row;
            border-bottom:1px solid black;
            height:15vh;
            align-items: center;
            font-size: 20px;
        }
        .main{
            height:100%;
            width:100%;
            display: flex;
            flex-direction: column;
        }
        .cards{
            display: flex;
            flex-direction: row;
            height:40%;
            width:100%;
            justify-content: space-evenly;
            align-items: center;
        }
        .card{
            height:200px;
            width:200px;
            border:1px solid black;
        }
        .table{
            width:100%;
        }
        table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 8px;
        overflow: hidden;
        }

        table th, 
        table td {
            padding: 12px 16px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="title">Dashboard</div>
            <ul>
                <li>Users</li>
                <li>Products</li>
                <li>Orders</li>
                <li>Settings</li>
            </ul>
        </div>
        <div class="content">
            <div class="header">
                <p>Dashboard Overview</p>
                <p>Profile</p>
            </div>
            <div class="main">
                <div class="cards">
                    <div class="card">1</div>
                    <div class="card">2</div>
                    <div class="card">3</div>
                    <div class="card">4</div>
                </div>
                <div class="table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Country</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Adam Smith</td>
                                <td>adam@example.com</td>
                                <td>Canada</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>John Doe</td>
                                <td>john@example.com</td>
                                <td>USA</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Yamin Khan</td>
                                <td>yamin@example.com</td>
                                <td>India</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
