<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Responsive Indian Flag with 24 Spokes</title> 
    <style> 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .flag-container {
            width: 90vw;
            aspect-ratio: 3 / 2;
            border: 4px solid #000000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            height: 100vh;
        }

        .band {
            flex: 1;
            width: 100%;
        }

        .saffron { 
            background-color: #FF671F; 
        }

        .white { 
            background-color: #FFFFFF; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }

        .green { 
            background-color: #046A38; 
        }

        .ashoka-chakra {
            height: 92%;
            aspect-ratio: 1 / 1;
        }

        .ashoka-chakra svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style> 
</head> 
<body> 

    <div class="flag-container"> 
        <div class="band saffron"></div> 
        <div class="white"> 
            <div class="ashoka-chakra">
                <svg viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="92" fill="none" stroke="#06038D" stroke-width="6"/>
                    <circle cx="100" cy="100" r="16" fill="none" stroke="#06038D" stroke-width="5"/>
                    <circle cx="100" cy="100" r="6" fill="#06038D"/>
                    
                    <g stroke="#06038D" stroke-width="2.5" fill="#06038D">
                        <g transform="rotate(0 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(15 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(30 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(45 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(60 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(75 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(90 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(105 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(120 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(135 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(150 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(165 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(180 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(195 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(210 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(225 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(240 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(255 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(270 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(285 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(300 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(315 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(330 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                        <g transform="rotate(345 100 100)"><polygon points="100,16 97,55 100,90 103,55"/></g>
                    </g>
                </svg>
            </div>
        </div> 
        <div class="band green"></div> 
    </div> 

</body> 
</html>
