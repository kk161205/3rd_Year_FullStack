<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .container{
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            flex-direction: row;
        }
        .count{
            font-size: 4rem;
            font-weight: bold;
        }
        button{
            font-size: 1.5rem;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background-color: #28a745;
        }
    </style>
</head>
<body>
    <h1>Jaap Counter</h1>
    <div class="container">
        <p id="count">0</p>
        <button id="increment">Increment</button>
        <button id="decrement">Decrement</button>
        <button id="reset">Reset</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
