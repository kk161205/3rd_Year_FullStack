<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        .container{
            height:100vh;
            width:100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cards{
            width: 50%;
            height: 50%;
            display: grid;  
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }
        .card{
            width: 100%;
            height: 100%;
            border:2px solid black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card:hover{
            background-color: aqua;
        }
        .card:active{
            background-color: red;
            color:white;
            font-size: larger;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cards">
            <div class="card" id="0"></div>
            <div class="card" id="1"></div>
            <div class="card" id="2"></div>
            <div class="card" id="3"></div>
            <div class="card" id="4"></div>
            <div class="card" id="5"></div>
            <div class="card" id="6"></div>
            <div class="card" id="7"></div>
            <div class="card" id="8"></div>
            <div class="card" id="9"></div>
            <div class="card" id="10"></div>
            <div class="card" id="11"></div>
            <div class="card" id="12"></div>
            <div class="card" id="13"></div>
            <div class="card" id="14"></div>
            <div class="card" id="15"></div>
        </div>
    </div>
    <script src="mem.js"></script>
</body>
</html>
