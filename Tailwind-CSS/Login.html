<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="bg-black h-screen w-screen flex items-center justify-center">
        <div>
            <div class="bg-gray-700 w-[400px] h-[500px] rounded-[50px] flex items-center justify-center flex-col gap-5">
                <p class="text-5xl text-white font-bold">Login</p>
                <div class="flex flex-col gap-3 mt-[20px]">
                    <label class="text-black text-xl font-bold">UserName</label>
                    <input type="text" class="bg-white w-80 h-12 rounded-lg outline-none border-none pl-4 text-xl invalid:border-red-500 invalid:text-pink-600 focus:border-sky-500 focus:outline">
                    <label class="text-black text-xl font-bold">Password</label>
                    <input type="password" class="bg-white w-80 h-12 rounded-lg outline-none border-none pl-4 text-xl invalid:border-red-500 invalid:text-pink-600 focus:border-sky-500 focus:outline">
                </div>
                <button class="bg-blue-500 text-white w-80 h-12 rounded-lg font-bold text-xl mt-15 hover:bg-sky-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 active:bg-blue-700">Login</button>
            </div>
        </div>
    </div>
</body>
</html>
